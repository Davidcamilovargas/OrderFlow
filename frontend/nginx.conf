server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/orders -> http://orders-api:8080/orders (la barra final de proxy_pass quita el prefijo /api).
    # Es el mismo papel que cumple el proxy de Vite en desarrollo: el navegador nunca sale de su origen.
    location /api/ {
        proxy_pass http://orders-api:8080/;
    }

    location / {
        try_files $uri /index.html;
    }
}